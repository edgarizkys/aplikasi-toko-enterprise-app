<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Toko Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0EA5E9', secondary: '#6366F1' } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-gradient-to-r from-primary to-secondary p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Toko Enterprise</h1>
            <div class="space-x-4">
                <button onclick="render('products')" class="hover:underline">Produk</button>
                <button onclick="render('sales')" class="hover:underline">Penjualan</button>
                <button onclick="render('customers')" class="hover:underline">Pelanggan</button>
            </div>
        </div>
    </nav>

    <main id="app" class="container mx-auto p-6">
        <div id="content" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-semibold mb-4">Dashboard</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 bg-blue-50 rounded-lg border-l-4 border-primary">Total Produk: <span id="prod-count">0</span></div>
                <div class="p-4 bg-indigo-50 rounded-lg border-l-4 border-secondary">Total Penjualan: <span id="sale-count">0</span></div>
                <div class="p-4 bg-green-50 rounded-lg border-l-4 border-green-500">Total Pelanggan: <span id="cust-count">0</span></div>
            </div>
        </div>
    </main>

    <script>
        const state = {
            products: [],
            sales: [],
            customers: []
        };

        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                Object.assign(state, data);
                document.getElementById('prod-count').innerText = state.products.length;
                document.getElementById('sale-count').innerText = state.sales.length;
                document.getElementById('cust-count').innerText = state.customers.length;
            } catch (e) { console.error('Fetch fail', e); }
        }

        function render(view) {
            const content = document.getElementById('content');
            const data = state[view] || [];
            content.innerHTML = `
                <h2 class="text-2xl font-bold mb-4 capitalize">${view}</h2>
                <table class="w-full text-left border-collapse">
                    <thead><tr class="border-b">${Object.keys(data[0] || {}).map(k => `<th class="p-2">${k}</th>`).join('')}</tr></thead>
                    <tbody>${data.map(item => `<tr class="border-b">${Object.values(item).map(v => `<td class="p-2">${v}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>
            `;
        }

        fetchData();
    </script>
</body>
</html>
