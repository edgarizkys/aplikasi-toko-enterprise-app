<!DOCTYPE html>
<html lang="id">
<head>

    <title>Dashboard - Aplikasi Toko Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563EB', dark: '#0F172A' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-dark text-white p-6">
            <h2 class="text-xl font-bold mb-10 text-blue-500">Aplikasi Toko</h2>
            <nav class="space-y-4">
                <a href="#" class="block py-2 px-4 bg-blue-600 rounded">Dashboard</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800 rounded">Produk</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800 rounded">Pesanan</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800 rounded">Pemasok</a>
                <a href="#" class="block py-2 px-4 hover:bg-gray-800 rounded">Karyawan</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-dark">Ringkasan Operasional</h1>
                <button class="bg-blue-600 text-white px-4 py-2 rounded shadow">Tambah Data</button>
            </header>

            <div class="grid grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow">
                    <p class="text-gray-500">Total Produk</p>
                    <h3 class="text-2xl font-bold">142</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <p class="text-gray-500">Pesanan Baru</p>
                    <h3 class="text-2xl font-bold">28</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <p class="text-gray-500">Total Pemasok</p>
                    <h3 class="text-2xl font-bold">12</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <p class="text-gray-500">Karyawan Aktif</p>
                    <h3 class="text-2xl font-bold">45</h3>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Nama</th>
                            <th class="p-4">Kategori</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                        <!-- JS inject -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script>
        async function fetchData() {
            const res = await fetch('/api/data');
            const data = await res.json();
            // Render logic here
        }
        fetchData();
    </script>
</body>
</html>
