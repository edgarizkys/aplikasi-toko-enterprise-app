<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Aplikasi Toko Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background Gradient Blobs -->
    <div class="absolute inset-0 opacity-20">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-orange-600 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-red-600 rounded-full blur-[150px]"></div>
    </div>

    <!-- Back to Home -->
    <a href="/" class="fixed top-6 left-6 flex items-center gap-2 text-sm text-slate-400 hover:text-white transition-colors z-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Kembali
    </a>

    <!-- Login Card -->
    <div id="login-form" class="reveal-scale relative z-10 w-full max-w-md mx-4">
        <div class="glass p-8 rounded-3xl border border-slate-800/50 shadow-2xl">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-orange-600 to-red-600 flex items-center justify-center text-3xl shadow-lg mb-4 float">🏪</div>
                <h1 class="text-2xl font-extrabold text-white">Aplikasi Toko Enterprise</h1>
                <p class="text-sm text-slate-400 mt-1">Masuk ke sistem kasir toko Anda</p>
            </div>

            <!-- Login Form -->
            <form id="loginFormEl" class="space-y-4" onsubmit="handleLogin(event)">
                <div class="fade-in-up delay-1">
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Email</label>
                    <input type="email" id="loginEmail" required placeholder="email@domain.com" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
                </div>
                <div class="fade-in-up delay-2">
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-slate-400">
                        <input type="checkbox" class="rounded border-slate-600 bg-slate-800 text-orange-500 focus:ring-orange-500/30">
                        Ingat saya
                    </label>
                    <a href="#" class="text-orange-400 hover:text-orange-300 transition-colors">Lupa password?</a>
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold rounded-xl shadow-lg hover:opacity-90 transition-all btn-shine magnetic-btn fade-in-up delay-3">
                    Masuk
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-slate-800"></div>
                <span class="text-xs text-slate-500">atau</span>
                <div class="flex-1 h-px bg-slate-800"></div>
            </div>

            <!-- Social Login -->
            <div class="space-y-3 fade-in-up delay-4">
                <button class="w-full py-3 bg-slate-900/60 border border-slate-700 text-slate-300 font-bold text-sm rounded-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Masuk dengan Google
                </button>
            </div>

            <!-- Register Link -->
            <p class="text-center text-sm text-slate-400 mt-6 fade-in-up delay-5">
                Belum punya akun? <a href="javascript:void(0)" onclick="showRegister()" class="text-orange-400 hover:text-orange-300 font-bold transition-colors">Daftar Sekarang</a>
            </p>
        </div>
    </div>

    <!-- Register Card (Hidden by default) -->
    <div id="register-form" class="reveal-scale relative z-10 w-full max-w-md mx-4" style="display:none;">
        <div class="glass p-8 rounded-3xl border border-slate-800/50 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-orange-600 to-red-600 flex items-center justify-center text-3xl shadow-lg mb-4 float">🏪</div>
                <h1 class="text-2xl font-extrabold text-white">Daftarkan Toko Anda</h1>
                <p class="text-sm text-slate-400 mt-1">Buat akun baru dalam 30 detik</p>
            </div>

            <form id="registerFormEl" class="space-y-4" onsubmit="handleRegister(event)">
                <div class="fade-in-up delay-1">
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Nama Lengkap</label>
                    <input type="text" id="regName" required placeholder="John Doe" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
                </div>
                <div class="fade-in-up delay-2">
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Email</label>
                    <input type="email" id="regEmail" required placeholder="email@domain.com" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
                </div>
                <div class="fade-in-up delay-3">
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Password</label>
                    <input type="password" id="regPassword" required placeholder="Minimal 8 karakter" minlength="8" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
                </div>
                <div class="fade-in-up delay-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Konfirmasi Password</label>
                    <input type="password" id="regConfirmPassword" required placeholder="Ulangi password" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
                </div>
                <div class="fade-in-up delay-5">
                    <label class="flex items-start gap-2 text-xs text-slate-400">
                        <input type="checkbox" required class="rounded border-slate-600 bg-slate-800 text-orange-500 focus:ring-orange-500/30 mt-0.5">
                        <span>Saya setuju dengan <a href="#" class="text-orange-400 hover:underline">Syarat & Ketentuan</a> dan <a href="#" class="text-orange-400 hover:underline">Kebijakan Privasi</a></span>
                    </label>
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold rounded-xl shadow-lg hover:opacity-90 transition-all btn-shine magnetic-btn fade-in-up delay-6">
                    Buat Akun
                </button>
            </form>

            <p class="text-center text-sm text-slate-400 mt-6 fade-in-up delay-6">
                Sudah punya akun? <a href="javascript:void(0)" onclick="showLogin()" class="text-orange-400 hover:text-orange-300 font-bold transition-colors">Masuk</a>
            </p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display:none;">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div class="relative glass p-8 rounded-3xl max-w-sm w-full text-center space-y-4 border border-emerald-500/30">
            <div class="w-20 h-20 mx-auto rounded-full bg-emerald-500/20 flex items-center justify-center text-4xl">✓</div>
            <h3 class="text-xl font-bold text-white" id="modalTitle">Berhasil!</h3>
            <p class="text-sm text-slate-400" id="modalMessage">Selamat datang!</p>
            <a href="/dashboard" class="inline-block px-8 py-3 bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold rounded-xl btn-shine">Masuk ke Dashboard</a>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
        }
        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }
        function showModal(title, msg) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('successModal').style.display = 'flex';
        }
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            if (email && pass) {
                localStorage.setItem('edgar_user', JSON.stringify({ email, name: email.split('@')[0] }));
                showModal('Login Berhasil!', 'Selamat datang kembali!');
            }
        }
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            if (pass !== confirm) {
                alert('Password tidak cocok!');
                return;
            }
            localStorage.setItem('edgar_user', JSON.stringify({ email, name }));
            showModal('Registrasi Berhasil!', 'Akun Anda telah dibuat. Selamat datang, ' + name + '!');
        }
        // Check URL hash for register
        if (window.location.hash === '#register') showRegister();
    </script>
</body>
</html>
