<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Toko Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #0EA5E9;
            --accent-to: #6366F1;
        }
        .gradient-bg { background: linear-gradient(135deg, var(--accent-from), var(--accent-to)); }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Masuk ke Toko</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full py-3 rounded-lg font-bold text-white gradient-bg hover:opacity-90 transition">
                Masuk
            </button>
        </form>
        <p class="mt-4 text-center text-gray-500 text-sm">
            Belum punya akses? Hubungi admin.
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) window.location.href = '/dashboard.html';
                else alert('Login gagal. Periksa kredensial.');
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
